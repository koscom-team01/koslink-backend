spring:
  application:
    name: koslink-test
  ai:
    openai:
      api-key: test-key
      chat:
        options:
          model: gpt-4o-mini
  datasource:
    url: jdbc:postgresql://localhost:5432/koscomdb
    username: admin
    password: adminpassword
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

naver:
  api:
    client-id: test-client-id
    client-secret: test-secret
    base-url: https://openapi.naver.com
    news-search-path: /v1/search/news.json

crawler:
  delay-ms: 0

news:
  analyze:
    base-url: http://localhost:8080
