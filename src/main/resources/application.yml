spring:
  application:
    name: koslink
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/koscomdb}
    username: ${SPRING_DATASOURCE_USERNAME:admin}
    password: ${SPRING_DATASOURCE_PASSWORD:adminpassword}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

naver:
  api:
    client-id: ${NAVER_CLIENT_ID:XDfkw7nEXh_TSWWWbYBy}
    client-secret: ${NAVER_CLIENT_SECRET:A6wJY6CriE}
    base-url: ${NAVER_BASE_URL:https://openapi.naver.com}
    news-search-path: /v1/search/news.json

ai:
  service:
    base-url: ${AI_SERVICE_URL:http://localhost:8000}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

crawler:
  delay-ms: 200  # 크롤링 요청 간 최소 딜레이 (밀리초)

